[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers

# models.py still uses datetime.utcnow as a column default (see the note in
# timeutils.py). Python 3.12 deprecates it; the warning is cosmetic and would
# otherwise bury the test output.
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
